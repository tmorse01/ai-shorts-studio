# Netlify reads this file from the base directory, which is set to "site" in the Netlify UI.
# Deploys run from GitHub on every push to main. Preview deploys are created for pull requests.

[build]
  command = "pnpm run build"
  publish = "dist"
  # Skip the build when nothing under site/ changed since the last deploy. With no previous
  # deploy there is nothing to compare against, so always build.
  ignore = "[ -n \"$CACHED_COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
